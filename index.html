const teams=divisions.flatMap(([region,entries],d)=>entries.map(([city,name,country],i)=>({id:d*4+i,city,name,country,region,conference:[0,1,4,5].includes(d)?"West":"East"})));

function save(){
 if(!state)return;
 let snapshot;
 try{snapshot=JSON.stringify(state)}catch(error){wffWarnSaveFailure(error);return}
 wffWritePersistentSave(KEY,snapshot).catch(error=>{
  try{localStorage.setItem(KEY,snapshot)}

 });

function el(id){return document.getElementById(id)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rng(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function rating(id,salt){return 67+Math.floor(rng((id+1)*8371+salt*127)()*25)}
function makeRoster(id){
 const positions=["QB","QB","QB","HB","HB","HB","FB","WR","WR","WR","WR","WR","TE","TE","LT","LT","LG","LG","C","C","RG","RG","RT","RT","EDGE","EDGE","EDGE","EDGE","DT","DT","DT","DT","MLB","SAM","WILL","CB","CB","CB","CB","CB","FS","FS","SS","SS","K","P"];
 const r=rng(id*104729+42017);
 const roster=wffApplyRosterNames(positions.map(position=>({position,overall:65+Math.floor(r()*28),age:21+Math.floor(r()*13)})),id,false);wffAssignJerseys(roster,id);return roster;
}
function makePracticeSquad(id){
 const positions=["QB","HB","WR","OL","DL","DB"],r=rng(id*104729+92017);
 const roster=wffApplyRosterNames(positions.map((position,i)=>({position,overall:58+((id*7+i*11)%15),age:21+Math.floor(r()*10),status:"Practice squad"})),id,true);wffAssignJerseys(roster,id);return roster;
}
function ensureRoster(){if(!state)return;let changed=false;if(!Array.isArray(state.roster)||state.roster.length!==46){state.roster=makeRoster(state.teamId);changed=true}if(!Array.isArray(state.practiceSquad)||state.practiceSquad.length!==6){state.practiceSquad=makePracticeSquad(state.teamId);changed=true}if(wffMigrateNames(state))changed=true;if(wffAssignJerseys(state.roster,state.teamId))changed=true;if(wffAssignJerseys(state.practiceSquad,state.teamId))changed=true;if(dnaEnsure(state))changed=true;if(wffInit(state))changed=true;if(wffEnsureHealth(state))changed=true;if(wffEnsureRosterBalance(state))changed=true;if(wffBusinessInit(state))changed=true;if(wffEnsureCoachTendencies(state))changed=true;if(wffStaffMarketInit(state))changed=true;if(wffScheduleInit(state))changed=true;if(!state.playerRegistry){wffEnsurePlayerRegistry(state);changed=true}else wffEnsurePlayerRegistry(state);if(state.week>18&&!state.playerSeasonHistory?.[state.finance.year]){if(wffArchivePlayerSeason(state,state.finance.year))changed=true}if(changed)save()}
function start(id){state={teamId:id,week:1,wins:0,losses:0,practiceSquad:makePracticeSquad(id),offense:"Balanced Multiple",front:"4-3",coverage:"Balanced",pressure:"Balanced",roster:makeRoster(id),games:[]};wffMigrateNames(state);wffAssignJerseys(state.roster,id);wffAssignJerseys(state.practiceSquad,id);dnaEnsure(state);wffInit(state);wffEnsureHealth(state);wffBusinessInit(state);wffEnsureCoachTendencies(state);wffStaffMarketInit(state);wffScheduleInit(state);wffEnsurePlayerRegistry(state);save();tab="overview";render()}
function reset(){if(confirm("Delete this browser's WFF franchise save and return to team selection?")){
 wffDeletePersistentSave(KEY).then(()=>{localStorage.removeItem(KEY);state=null;render()}).catch(wffWarnSaveFailure)
}}
function teamLabel(t){return t.city+" "+t.name}
function selectScreen(){const options=["All",...divisions.map(d=>d[0])];const matches=teams.filter(t=>(region==="All"||t.region===region)&&teamLabel(t).toLowerCase().includes(filter.toLowerCase()));el("app").innerHTML='<h1>Choose your franchise.</h1><p class="intro">Thirty-two fictional franchises. Eight geographic divisions. One global championship. Select the city you want to build into a football powerhouse.</p><div class="toolbar"><input id="search" placeholder="Search franchises…" value="'+esc(filter)+'" aria-label="Search franchises"><select id="region" aria-label="Filter by region">'+options.map(x=>'<option '+(x===region?'selected':'')+'>'+esc(x)+'</option>').join("")+'</select></div><div class="teams">'+matches.map(t=>'<button class="team" data-team="'+t.id+'"><span class="city">'+esc(t.city)+', '+esc(t.country)+'</span><strong>'+esc(t.name)+'</strong><div class="region">'+esc(t.region)+' • '+t.conference+' Conference</div></button>').join("")+'</div>'+(matches.length?'':'<p>No franchises match your search.</p>');el("search").oninput=e=>{filter=e.target.value;selectScreen();el("search").focus();el("search").setSelectionRange(filter.length,filter.length)};el("region").onchange=e=>{region=e.target.value;selectScreen()};document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{const t=teams[+b.dataset.team];if(confirm("Begin a new franchise with the "+teamLabel(t)+"?"))start(t.id)})}
function dashboard(){if(wffLive)wffLiveStop();const t=teams[state.teamId];const tabs=[["overview","Overview"],["roster","Roster"],["depth","Depth Chart"],["staff","Staff"],["schedule","Schedule"],["timeline","Timeline"],["league","League"],["rankings","Rankings & Stats"],["mystats","My Team Stats"],["awards","Weekly Awards"],["finance","Contracts & Cap"],["business","Business"],["office","Front Office"],["trades","Trades"],["training","Training"],["coaching","Coaching"],["playbooks","Playbooks"],["stadium","Stadium & Weather"],["medical","Medical"],["sim","Game Day"]];el("app").innerHTML='<div class="row"><div class="wff-team-head">'+wffLogo(t,88)+'<div><h1>'+esc(teamLabel(t))+'</h1><div class="sub">'+esc(t.country)+' • '+esc(t.region)+' • '+t.conference+' Conference</div></div></div><button id="reset" class="btn secondary">New franchise / Reset</button></div><nav class="tabs" aria-label="Franchise sections">'+tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+(id==='sim'?' wff-game-day':'')+'">'+label+'</button>').join("")+'</nav><div id="view"></div>';el("reset").onclick=reset;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;dashboard()});drawView()}
document.addEventListener("click",event=>{const btn=event.target.closest?.("[data-wff-player]");if(!btn)return;const parts=btn.getAttribute("data-wff-player").split("|");if(parts.length!==3)return;const id=teams.find(t=>String(t.id)===parts[0])?.id;if(id==null)return;const view=el("view");const prior=view.innerHTML;view.innerHTML=wffPlayerProfileView(state,id,parts[1],parts[2])+'<button class="btn secondary" id="wff-profile-back">Back to Statistics</button>';el("wff-profile-back").onclick=()=>{view.innerHTML=prior};});
function drawView(){const t=teams[state.teamId],v=el("view");if(tab==="sim"&&wffLive){wffLiveRender();return}if(tab==="overview"){const avg=Math.round(state.roster.reduce((s,p)=>s+p.overall,0)/state.roster.length);v.innerHTML='<div class="panel"><h2>'+wffLogo(t,38)+' Franchise headquarters</h2><div class="grid"><div class="stat"><small>Season record</small><b>'+state.wins+'–'+state.losses+'</b></div><div class="stat"><small>Next scheduled game</small><b>Week '+state.week+'</b></div><div class="stat"><small>Roster average</small><b>'+avg+' OVR</b></div><div class="stat"><small>Active roster</small><b>'+state.roster.length+' / 46</b></div><div class="stat"><small>Practice squad</small><b>'+state.practiceSquad.length+' / 6</b></div></div><p class="notice">All franchises follow a 46-player active roster and six-player practice squad rule. Player DNA, staff, depth charts and estimated contracts are experimental. Full transactions and season management are upcoming.</p></div><div class="panel"><h2>Team identity</h2><div class="grid"><div><small class="muted">Offensive system</small><h3>'+esc(state.offense)+'</h3></div><div><small class="muted">Defensive front</small><h3>'+esc(state.front)+'</h3></div><div><small class="muted">Coverage</small><h3>'+esc(state.coverage)+'</h3></div><div><small class="muted">Pressure</small><h3>'+esc(state.pressure)+'</h3></div></div></div>'+ (wffNextMatch(state)?'<section class="panel"><h2>Next game • Week '+state.week+'</h2><p>Only the next scheduled opponent can be played.</p><button class="btn wff-overview-play" id="overview-play-next">Simulate next game</button></section>':'') ;const nextButton=el("overview-play-next");if(nextButton)nextButton.onclick=()=>{if(!wffNextMatch(state))return;tab="sim";dashboard();save();wffLiveStart(state,drawView)}}
else if(tab==="roster"){v.innerHTML='<section class="panel"><h2>Active roster — 46 players</h2><p class="muted">Select a player to view measurements, positional skills, archetype, mentality and developing techniques. All profiles are fictional and experimental.</p>'+state.roster.map((p,i)=>dnaPlayerCard(p,i,false)).join("")+'</section><section class="panel"><h2>Practice squad — 6 players</h2><p class="muted">Developmental players; promotions and transactions are upcoming.</p>'+state.practiceSquad.map((p,i)=>dnaPlayerCard(p,i,true)).join("")+'</section>'}
else if(tab==="depth"){v.innerHTML=wffDepthView(state);wffDepthBind(state,drawView)}
else if(tab==="staff"){v.innerHTML=wffStaffMarketView(state);wffStaffMarketBind(state,drawView)}
else if(tab==="timeline"){v.innerHTML=wffTimelineView(state);wffTimelineBind(state,drawView)}
else if(tab==="schedule"){v.innerHTML=wffScheduleView(state);wffScheduleBind(state,drawView)}
else if(tab==="league"){v.innerHTML=wffLeagueHubView(state)}
else if(tab==="rankings"){v.innerHTML=wffLeagueStatsView(state)}
else if(tab==="mystats"){v.innerHTML=wffMyTeamStatsView(state)}
else if(tab==="awards"){v.innerHTML=wffLeagueAwardsView(state)}
else if(tab==="finance"){v.innerHTML=wffFinanceView(state)}
else if(tab==="business"){v.innerHTML=wffBusinessView(state);wffBusinessBind(state,drawView)}
else if(tab==="office"){v.innerHTML=wffFrontOfficeView(state)}
else if(tab==="trades"){v.innerHTML=wffTradeView(state)}
else if(tab==="training"){v.innerHTML=wffTrainingView(state);wffTrainingBind(state,drawView)}
else if(tab==="coaching"){const fields=[["offense","Offensive system",OFF],["front","Defensive front",FRONT],["coverage","Coverage philosophy",COVER],["pressure","Pressure philosophy",PRESS]];v.innerHTML=wffCoachView(state)+'<section class="panel"><h2>Coaching philosophies</h2><p class="muted">These settings influence the early simulator. More detailed playbooks, personnel packages, and situational play-calling are planned.</p><div class="grid">'+fields.map(([key,label,options])=>'<label class="stat"><strong>'+label+'</strong><br><select data-setting="'+key+'" style="width:100%;margin-top:8px">'+options.map(o=>'<option '+(state[key]===o?'selected':'')+'>'+esc(o)+'</option>').join("")+'</select></label>').join("")+'</div></section>';document.querySelectorAll("[data-setting]").forEach(s=>s.onchange=()=>{state[s.dataset.setting]=s.value;save()})}
else if(tab==="playbooks"){v.innerHTML=wffPlaybookView(state);wffPlaybookBind(state)}
else if(tab==="stadium"){v.innerHTML=wffWeatherView(state.teamId,state.week,state.finance?.year||2026)}
else if(tab==="medical"){v.innerHTML=wffMedicalView(state)}
else if(tab==="sim"){const last=state.games.at(-1),next=wffNextMatch(state),opponent=next?teams[next.home===state.teamId?next.away:next.home]:null;v.innerHTML='<section class="panel"><h2>Game Day — Experimental Slow Sim</h2><p class="muted">Play your scheduled opponent. Other league games are resolved after yours, with persistent standings and postseason qualification.</p><div class="row"><div><strong>'+esc(teamLabel(t))+'</strong><div class="sub">Offense: '+esc(state.offense)+'</div></div><button class="btn" id="play">Simulate next game</button></div></section>'+(opponent?wffGameplanView(state,opponent):'')+(last?'<section class="panel"><h2>Last game — Week '+last.week+'</h2><div class="score">'+esc(last.home)+' '+last.homeScore+' — '+last.awayScore+' '+esc(last.away)+'</div><p class="notice">'+(last.homeScore===last.awayScore?"Tie game":last.homeScore>last.awayScore?last.home+" win":last.away+" win")+' • Exhibition prototype</p><h3>Play-by-play highlights</h3><div class="log">'+last.log.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></section>':'');wffGameplanBind(state);if(last){const panel=document.createElement("section");panel.className="panel";panel.innerHTML='<h2>Completed Game Box Scores</h2>'+state.games.slice().reverse().map((g,i)=>'<div class="line"><span>Week '+esc(String(g.week))+' • '+esc(g.home)+' vs '+esc(g.away)+'</span><button class="btn secondary" data-box-index="'+(state.games.length-1-i)+'">Box Score</button></div>').join('');v.appendChild(panel);panel.querySelectorAll("[data-box-index]").forEach(b=>b.onclick=()=>{v.innerHTML=wffGameBoxScoreView(state,state.games[Number(b.dataset.boxIndex)])+'<button class="btn secondary" id="box-history-back">Back to Game Day</button>';document.getElementById("box-history-back").onclick=drawView})}el("play").disabled=!wffNextMatch(state);el("play").onclick=()=>{save();wffLiveStart(state,drawView)}}}
function simulate(){const us=teams[state.teamId];const pool=teams.filter(t=>t.id!==us.id);const r=rng((state.teamId+1)*123457+state.week*89713);const opp=pool[Math.floor(r()*pool.length)];const ours=state.roster.reduce((s,p)=>s+p.overall,0)/state.roster.length;const theirs=rating(opp.id,12);const weather=wffWeather(us.id,state.week,state.finance?.year||2026),weatherEffects=wffWeatherModifiers(weather);const clock=wffClockCreate();const log=["Game conditions at "+weather.stadium.name+": "+weather.condition+", "+weather.temperature+"°F, wind "+weather.wind+" mph."];let score=[0,0];const passBias=({"Power Run":.43,"Wide Zone":.48,"Balanced Multiple":.56,"West Coast":.61,"Vertical Passing":.64,"Spread":.65,"Air Raid":.73,"Run and Shoot":.72})[state.offense];const downs=["1st","2nd","3rd","4th"];let totalPlays=0;for(let drive=0;drive<22;drive++){const side=drive%2,attacking=side===0?us:opp,defending=side===0?opp:us;let yard=20+Math.floor(r()*16),down=1,toGo=10,plays=0;const bias=side===0?passBias:.55;const talent=side===0?ours:theirs,defTalent=side===0?theirs:ours;let result="punt";while(plays<13&&yard<100){plays++;totalPlays++;const leading=score[side]-score[1-side];const policy=wffClockChoose(clock,leading,clock.timeouts[1-side],yard);const kneel=policy==="kneel";const pass=!kneel&&r()<bias;const weatherFactor=pass?weatherEffects.passAccuracy*weatherEffects.catching:weatherEffects.runEfficiency;const chance=Math.max(.12,Math.min(.85,(.58+(talent-defTalent)*.012+(side===0&&state.pressure==="Aggressive Blitz"&&pass?-.01:0))*weatherFactor));let gain;if(kneel){gain=-1}else if(r()<chance){gain=pass?Math.floor(3+r()*17):Math.floor(2+r()*9);if(pass&&r()<.06)gain+=20}else{gain=pass?(r()<.22?-Math.floor(2+r()*7):0):Math.floor(r()*4)-2}wffClockSnap(clock,kneel?"kneel":pass?(gain===0?"pass_incomplete":"pass_complete"):"run");wffClockBetweenPlays(clock,{hurry:policy==="hurry"||policy==="two-minute",seconds:10});if(clock.remaining===0)wffClockEndQuarter(clock);if(!kneel&&r()<.008+weatherEffects.turnoverExtra){result="turnover";break}yard+=gain;if(yard>=100){result="touchdown";break}if(gain>=toGo){down=1;toGo=10}else{down++;toGo-=gain}if(down===4){const profile=side===0?state.staff.hc.tendencies:wffCoachProfile(opp.id);const decision=wffCoachFourthCall({yard,toGo,quarter:clock.quarter,seconds:clock.remaining,lead:score[side]-score[1-side],timeouts:clock.timeouts[side],aggression:profile.aggression,judgment:profile.judgment,kicker:75,wind:weather.wind,weather:weather.condition,seed:state.week+"|"+drive+"|"+plays});if(decision.call==="field_goal"){result=r()<decision.kick.probability*weatherEffects.kicking?"field goal":"missed field goal";log.push("Q"+clock.quarter+" • "+teamLabel(attacking)+" attempts a "+Math.round(decision.kick.distance)+"-yard field goal.");break}if(decision.call==="punt"){result="punt";break}log.push("Q"+clock.quarter+" • "+teamLabel(attacking)+" chooses to go on 4th & "+toGo+" from the "+yard+".");const conversion=wffCoachConversionProbability(toGo,talent,defTalent,weatherEffects.runEfficiency);wffClockSnap(clock,"run",{duration:5});if(r()<conversion){const gained=Math.max(toGo,Math.round(toGo+r()*5));yard+=gained;down=1;toGo=10;log.push("Fourth down converted for "+gained+" yards.");if(yard>=100){result="touchdown";break}}else{result="turnover on downs";log.push("Fourth-down attempt stopped.");break}}}if(result==="touchdown"){score[side]+=r()<.95?7:6}else if(result==="field goal")score[side]+=3;log.push("Q"+Math.min(4,Math.floor(drive/5.5)+1)+" • "+teamLabel(attacking)+": "+plays+" plays, "+result+(result==="touchdown"?" (+7 or +6)":result==="field goal"?" (+3)":"")+".");}
log.push("Clock engine: "+clock.events.length+" timed plays recorded; last period Q"+clock.quarter+" "+wffClockTime(clock.remaining)+".");const medical=wffPlayWorkload(state,weather,"week-"+state.week);log.push("Medical report: "+medical.playersTracked+" players tracked; "+medical.injuries.length+" injuries.");for(const injury of medical.injuries)log.push(injury.position+" "+injury.name+": "+injury.injury+" (estimated "+injury.weeks+" weeks).");const homeScore=score[0],awayScore=score[1];if(homeScore>awayScore)state.wins++;else if(homeScore<awayScore)state.losses++;const game={week:state.week,home:teamLabel(us),away:teamLabel(opp),homeScore,awayScore,log:log.slice(-16),totalPlays};state.games.push(game);wffBusinessRecordGame(state,game);state.week++;wffMedicalAdvance(state);save();drawView()}
function render(){if(state){ensureRoster();dashboard()}else selectScreen()}
wffReadPersistentSave(KEY).then(raw=>{
 if(raw){try{const recovered=JSON.parse(raw);if(recovered&&Number.isInteger(recovered.teamId)&&teams[recovered.teamId])state=recovered}catch(error){console.error("WFF IndexedDB save unreadable; retaining legacy backup",error)}}
 render();
}).catch(error=>{console.warn("WFF IndexedDB unavailable; using legacy save",error);render()});
</script></body></html>
