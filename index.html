<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1422">
<title>World Football Federation | Alpha 0.1</title>
<style>
:root{color-scheme:dark;--bg:#09111d;--panel:#132236;--panel2:#1b2e45;--line:#30445b;--text:#f0f5fb;--muted:#a7b7c8;--accent:#57d7a3;--gold:#f2c36b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#173651 0,#09111d 52%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,select{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:25px;font-weight:900;letter-spacing:.06em}.brand span{color:var(--accent)}.sub,.muted{color:var(--muted)}.tag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--gold)}h1{font-size:clamp(28px,5vw,46px);line-height:1.12;margin:30px 0 10px}h2{font-size:21px;margin:0 0 14px}h3{margin:0 0 8px}.intro{max-width:730px;color:var(--muted)}.panel{background:rgba(19,34,54,.96);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar input,.toolbar select,select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px;min-width:0}.toolbar input{flex:1;min-width:180px}.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.team{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;text-align:left;color:var(--text);transition:.15s}.team:hover,.team:focus-visible{border-color:var(--accent);transform:translateY(-2px)}.team .city{color:var(--muted);font-size:12px}.team strong{display:block;font-size:19px}.team .region{font-size:12px;color:var(--gold);margin-top:12px}.btn{background:var(--accent);border:0;border-radius:10px;padding:11px 17px;color:#072116;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.stat{background:var(--panel2);padding:15px;border-radius:12px}.stat b{font-size:28px;display:block}.stat small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px}.tabs button.active{background:var(--accent);color:#082117;border-color:var(--accent);font-weight:800}.line{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:15px}.line small{color:var(--muted)}.score{font-size:clamp(24px,5vw,40px);font-weight:900;text-align:center}.log{max-height:340px;overflow:auto;background:#0b1929;border-radius:10px;padding:12px}.log p{border-bottom:1px solid #24364a;padding-bottom:8px;margin:8px 0}.notice{color:var(--gold);font-size:13px}.footer{margin-top:35px;color:var(--muted);font-size:12px}.hidden{display:none!important}@media(max-width:600px){.shell{padding:14px}.panel{padding:15px}.brand{font-size:21px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div><div class="brand">🌐 <span>WFF</span> WORLD FOOTBALL FEDERATION</div><div class="sub">A global American football franchise simulator</div></div><span class="tag">ALPHA 0.1 • PROTOTYPE</span></header>
<main id="app"></main><footer class="footer">WFF is an independent fictional football project. All teams and players are fictional. Alpha simulation and ratings are placeholders for testing.</footer>
</div>
<script>
"use strict";
const divisions=[
["North America",[["New York","Empire","USA"],["Chicago","Enforcers","USA"],["Toronto","Thunder","Canada"],["Mexico City","Jaguars","Mexico"]]],
["South America",[["São Paulo","Titans","Brazil"],["Buenos Aires","Condors","Argentina"],["Santiago","Sentinels","Chile"],["Bogotá","Pumas","Colombia"]]],
["Western Europe",[["London","Monarchs","United Kingdom"],["Paris","Phantoms","France"],["Madrid","Royals","Spain"],["Dublin","Wolves","Ireland"]]],
["Central & Northern Europe",[["Berlin","Blitz","Germany"],["Amsterdam","Admirals","Netherlands"],["Stockholm","Vikings","Sweden"],["Warsaw","Hussars","Poland"]]],
["East & South Asia",[["Tokyo","Dragons","Japan"],["Seoul","Guardians","South Korea"],["Shanghai","Tigers","China"],["Mumbai","Cobras","India"]]],
["Oceania",[["Sydney","Sharks","Australia"],["Melbourne","Marauders","Australia"],["Brisbane","Breakers","Australia"],["Auckland","Warriors","New Zealand"]]],
["Africa",[["Johannesburg","Rhinos","South Africa"],["Cairo","Scorpions","Egypt"],["Lagos","Lions","Nigeria"],["Nairobi","Cheetahs","Kenya"]]],
["Middle East",[["Dubai","Falcons","United Arab Emirates"],["Riyadh","Stallions","Saudi Arabia"],["Doha","Vipers","Qatar"],["Istanbul","Guardians","Türkiye"]]]
];
const teams=divisions.flatMap(([region,entries],d)=>entries.map(([city,name,country],i)=>({id:d*4+i,city,name,country,region,conference:[0,1,4,5].includes(d)?"West":"East"})));
const OFF=["Balanced Multiple","West Coast","Power Run","Vertical Passing","Spread","Wide Zone","Air Raid","Run and Shoot"];
const FRONT=["4-3","3-4","4-2-5","3-3-5"];
const COVER=["Balanced","Cover 2","Cover 3","Man","Match Quarters"];
const PRESS=["Balanced","Conservative","Aggressive Blitz"];
const KEY="wff-alpha01-franchise";
let state=load(),tab="overview",filter="",region="All";
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Number.isInteger(v.teamId)&&teams[v.teamId]?v:null}catch{return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert("Browser storage is unavailable. Changes may not persist.")}}
function el(id){return document.getElementById(id)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rng(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function rating(id,salt){return 67+Math.floor(rng((id+1)*8371+salt*127)()*25)}
function makeRoster(id){const first=["Marcus","Andre","Caleb","Ethan","Jalen","Noah","Isaiah","Darius","Luca","Mateo","Jordan","Malik","Owen","Elijah","Victor","Leo","Adrian","Kieran","Tariq","Jonah"];const last=["Carter","Reed","Hayes","Bennett","Brooks","Morgan","Price","Walker","Santos","Kim","Okafor","Silva","Rivera","Fischer","Mensah","Collins","Ward","Turner","Cole","Navarro"];const positions=["QB","HB","WR","WR","WR","TE","LT","LG","C","RG","RT","EDGE","EDGE","DT","DT","MLB","OLB","CB","CB","CB","FS","SS","K","P"];const r=rng(id*104729+42017);return positions.map((position,i)=>({position,name:first[Math.floor(r()*first.length)]+" "+last[Math.floor(r()*last.length)],overall:65+Math.floor(r()*28),age:21+Math.floor(r()*13)}))}
function start(id){state={teamId:id,week:1,wins:0,losses:0,offense:"Balanced Multiple",front:"4-3",coverage:"Balanced",pressure:"Balanced",roster:makeRoster(id),games:[]};save();tab="overview";render()}
function reset(){if(confirm("Delete this browser's WFF franchise save and return to team selection?")){localStorage.removeItem(KEY);state=null;render()}}
function teamLabel(t){return t.city+" "+t.name}
function selectScreen(){const options=["All",...divisions.map(d=>d[0])];const matches=teams.filter(t=>(region==="All"||t.region===region)&&teamLabel(t).toLowerCase().includes(filter.toLowerCase()));el("app").innerHTML='<h1>Choose your franchise.</h1><p class="intro">Thirty-two fictional franchises. Eight geographic divisions. One global championship. Select the city you want to build into a football powerhouse.</p><div class="toolbar"><input id="search" placeholder="Search franchises…" value="'+esc(filter)+'" aria-label="Search franchises"><select id="region" aria-label="Filter by region">'+options.map(x=>'<option '+(x===region?'selected':'')+'>'+esc(x)+'</option>').join("")+'</select></div><div class="teams">'+matches.map(t=>'<button class="team" data-team="'+t.id+'"><span class="city">'+esc(t.city)+', '+esc(t.country)+'</span><strong>'+esc(t.name)+'</strong><div class="region">'+esc(t.region)+' • '+t.conference+' Conference</div></button>').join("")+'</div>'+(matches.length?'':'<p>No franchises match your search.</p>');el("search").oninput=e=>{filter=e.target.value;selectScreen();el("search").focus();el("search").setSelectionRange(filter.length,filter.length)};el("region").onchange=e=>{region=e.target.value;selectScreen()};document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{const t=teams[+b.dataset.team];if(confirm("Begin a new franchise with the "+teamLabel(t)+"?"))start(t.id)})}
function dashboard(){const t=teams[state.teamId];const tabs=[["overview","Overview"],["roster","Roster"],["coaching","Coaching"],["sim","Game Day"]];el("app").innerHTML='<div class="row"><div><h1>'+esc(teamLabel(t))+'</h1><div class="sub">'+esc(t.country)+' • '+esc(t.region)+' • '+t.conference+' Conference</div></div><button id="reset" class="btn secondary">New franchise / Reset</button></div><nav class="tabs" aria-label="Franchise sections">'+tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join("")+'</nav><div id="view"></div>';el("reset").onclick=reset;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;dashboard()});drawView()}
function drawView(){const t=teams[state.teamId],v=el("view");if(tab==="overview"){const avg=Math.round(state.roster.reduce((s,p)=>s+p.overall,0)/state.roster.length);v.innerHTML='<div class="panel"><h2>Franchise headquarters</h2><div class="grid"><div class="stat"><small>Season record</small><b>'+state.wins+'–'+state.losses+'</b></div><div class="stat"><small>Next exhibition game</small><b>Week '+state.week+'</b></div><div class="stat"><small>Roster average</small><b>'+avg+' OVR</b></div><div class="stat"><small>Roster size (prototype)</small><b>'+state.roster.length+'</b></div></div><p class="notice">Prototype rosters are fictional 24-player samples, not full regulation rosters. Season schedules, salary cap, contracts, and league standings are upcoming systems.</p></div><div class="panel"><h2>Team identity</h2><div class="grid"><div><small class="muted">Offensive system</small><h3>'+esc(state.offense)+'</h3></div><div><small class="muted">Defensive front</small><h3>'+esc(state.front)+'</h3></div><div><small class="muted">Coverage</small><h3>'+esc(state.coverage)+'</h3></div><div><small class="muted">Pressure</small><h3>'+esc(state.pressure)+'</h3></div></div></div>'}
else if(tab==="roster"){v.innerHTML='<section class="panel"><h2>Initial player roster</h2><p class="muted">Generated fictional players. Ratings and player names are development placeholders.</p>'+state.roster.map(p=>'<div class="line"><span><strong>'+esc(p.position)+'</strong> '+esc(p.name)+' <small>Age '+p.age+'</small></span><strong>'+p.overall+' OVR</strong></div>').join("")+'</section>'}
else if(tab==="coaching"){const fields=[["offense","Offensive system",OFF],["front","Defensive front",FRONT],["coverage","Coverage philosophy",COVER],["pressure","Pressure philosophy",PRESS]];v.innerHTML='<section class="panel"><h2>Coaching philosophies</h2><p class="muted">These settings influence the early simulator. More detailed playbooks, personnel packages, and situational play-calling are planned.</p><div class="grid">'+fields.map(([key,label,options])=>'<label class="stat"><strong>'+label+'</strong><br><select data-setting="'+key+'" style="width:100%;margin-top:8px">'+options.map(o=>'<option '+(state[key]===o?'selected':'')+'>'+esc(o)+'</option>').join("")+'</select></label>').join("")+'</div></section>';document.querySelectorAll("[data-setting]").forEach(s=>s.onchange=()=>{state[s.dataset.setting]=s.value;save()})}
else if(tab==="sim"){const last=state.games.at(-1);v.innerHTML='<section class="panel"><h2>Game Day — Experimental Slow Sim</h2><p class="muted">Run a simplified exhibition game against a randomly selected opponent. Results are saved locally. This is not yet a calibrated NFL-style simulation.</p><div class="row"><div><strong>'+esc(teamLabel(t))+'</strong><div class="sub">Offense: '+esc(state.offense)+'</div></div><button class="btn" id="play">Simulate next game</button></div></section>'+(last?'<section class="panel"><h2>Last game — Week '+last.week+'</h2><div class="score">'+esc(last.home)+' '+last.homeScore+' — '+last.awayScore+' '+esc(last.away)+'</div><p class="notice">'+(last.homeScore===last.awayScore?"Tie game":last.homeScore>last.awayScore?last.home+" win":last.away+" win")+' • Exhibition prototype</p><h3>Play-by-play highlights</h3><div class="log">'+last.log.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></section>':'');el("play").onclick=simulate}}
function simulate(){const us=teams[state.teamId];const pool=teams.filter(t=>t.id!==us.id);const r=rng((state.teamId+1)*123457+state.week*89713);const opp=pool[Math.floor(r()*pool.length)];const ours=state.roster.reduce((s,p)=>s+p.overall,0)/state.roster.length;const theirs=rating(opp.id,12);const log=[];let score=[0,0];const passBias=({"Power Run":.43,"Wide Zone":.48,"Balanced Multiple":.56,"West Coast":.61,"Vertical Passing":.64,"Spread":.65,"Air Raid":.73,"Run and Shoot":.72})[state.offense];const downs=["1st","2nd","3rd","4th"];let totalPlays=0;for(let drive=0;drive<22;drive++){const side=drive%2,attacking=side===0?us:opp,defending=side===0?opp:us;let yard=20+Math.floor(r()*16),down=1,toGo=10,plays=0;const bias=side===0?passBias:.55;const talent=side===0?ours:theirs,defTalent=side===0?theirs:ours;let result="punt";while(plays<13&&yard<100){plays++;totalPlays++;const pass=r()<bias;const chance=Math.max(.12,Math.min(.85,.58+(talent-defTalent)*.012+(side===0&&state.pressure==="Aggressive Blitz"&&pass?-.01:0)));let gain;if(r()<chance){gain=pass?Math.floor(3+r()*17):Math.floor(2+r()*9);if(pass&&r()<.06)gain+=20}else{gain=pass?(r()<.22?-Math.floor(2+r()*7):0):Math.floor(r()*4)-2}if(r()<.008){result="turnover";break}yard+=gain;if(yard>=100){result="touchdown";break}if(gain>=toGo){down=1;toGo=10}else{down++;toGo-=gain}if(down>4){result=yard>=65&&r()<.68?"field goal":"punt";break}if(down===4&&yard>=65&&toGo>3){result=r()<.73?"field goal":"missed field goal";break}}if(result==="touchdown"){score[side]+=r()<.95?7:6}else if(result==="field goal")score[side]+=3;log.push("Q"+Math.min(4,Math.floor(drive/5.5)+1)+" • "+teamLabel(attacking)+": "+plays+" plays, "+result+(result==="touchdown"?" (+7 or +6)":result==="field goal"?" (+3)":"")+".");}
const homeScore=score[0],awayScore=score[1];if(homeScore>awayScore)state.wins++;else if(homeScore<awayScore)state.losses++;const game={week:state.week,home:teamLabel(us),away:teamLabel(opp),homeScore,awayScore,log:log.slice(-16),totalPlays};state.games.push(game);state.week++;save();drawView()}
function render(){if(state)dashboard();else selectScreen()}
render();
</script></body></html>
